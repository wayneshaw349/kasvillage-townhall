<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,system-ui,sans-serif}
  #view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #hud{position:absolute;inset:0;pointer-events:none;color:#e8e2d0;font-size:12px}
  .bar{position:absolute;border:1px solid rgba(0,0,0,.5)}
  .bar > i{display:block;height:100%}
  .lbl{position:absolute;text-shadow:1px 1px 0 #000;white-space:pre}
  #err{position:absolute;inset:0;background:#111;color:#e88;padding:16px;
    font-family:monospace;font-size:11px;white-space:pre-wrap;overflow:auto;display:none}
  .stick{position:absolute;bottom:24px;width:96px;height:96px;border-radius:50%;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)}
  .stick > b{position:absolute;left:32px;top:32px;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.25);display:block}
  .btn{position:absolute;width:58px;height:58px;border-radius:50%;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);
    color:#e8e2d0;font-size:13px;line-height:58px;text-align:center}
  #pad{position:absolute;inset:0;pointer-events:auto}
</style>

<canvas id="view"></canvas>
<div id="hud"></div>
<div id="pad"></div>
<div id="err"></div>

    case "giveXp": world.flags.xp = (world.flags.xp || 0) + (a.amount || 0); break;

}

// ---- dialogue -------------------------------------------------------------

// ---- encounters -----------------------------------------------------------
var ENC = { steps: 0, threshold: 0, zone: null, rng: null };
function updateEncounters(dt) {
  var pl = nodes[playerId];
  if (!pl || dialogueOpen() || SHOP) return;
  var zone = null;
  Object.keys(nodes).forEach(function (id) {
    var n = nodes[id];
    if (n.type === "Area3D" && n.encounterZone && n._in) zone = n.encounterZone;
  });
  if (!zone) { ENC.zone = null; return; }
  if (ENC.zone !== zone) {
    ENC.zone = zone; ENC.steps = 0;
    ENC.rng = srandFor("enc:" + zone);
    var def = (scene.encounters || {})[zone] || {};
    ENC.threshold = (def.stepsMin || 6) + ENC.rng() * ((def.stepsMax || 14) - (def.stepsMin || 6));
  }
  if (INPUT.move.length > 0.1) ENC.steps += dt * 3;
  if (ENC.steps >= ENC.threshold) {
    ENC.steps = 0;
    var d2 = (scene.encounters || {})[zone] || {};

  }
}
function spawnEncounter(zone) {

  def.spawn.forEach(function (sp) { total += sp.weight || 1; });

    type: "Actor", mesh: pick.mesh, material: pick.material,
    tags: ["enemy", "encounter"],
    transform: { pos: [pl.worldPos.x + Math.cos(ang) * r, 0, pl.worldPos.z + Math.sin(ang) * r] },
    stats: pick.stats || { hp: 10, speed: 2.5, attack: 3 }

  foe.stateMachine = pick.stateMachine || {
    initial: "chase",
    states: {
      chase: { behavior: { type: "seek", target: playerId, speed: foe.stats.speed || 2.5 },
               transitions: [{ to: "strike", when: "distance(self, player) < 2" }] },
      strike: { onEnter: [{ action: "damage", target: playerId, amount: foe.stats.attack || 3 }],
                transitions: [{ to: "chase", when: "self.hp > 0" }] },
      dead: { onEnter: [{ action: "despawn", target: "self", delay: 1 }] }

// ---------------------------------------------------------------------------
// v3: BATTLE SYSTEMS  -- GridBattle (Tactics) and ATB (FF7-style), plus the
// menu overlay. Both are modal: while a battle owns the screen, the field
// scene freezes underneath and resumes on resolution.
// ---------------------------------------------------------------------------
// A battle is STARTED by an action:  {action:"startBattle", args:[battleId]}
// scene.battles[battleId] = {
//   type: "grid" | "atb",
//   grid?: { w, h, heights?: [[..]] },        (grid battles)
//   party: [unitId], foes: [unitId],
//   units: { unitId: { name, hp, atk, def, spd, move?, range?, pos?: [x,y] } },
//   rewards?: { xp, gold, items?: [id] },
//   onWin?: [actions], onLose?: [actions]
// }

var BATTLE = null, battleEl = null;

function battleOpen() { return !!BATTLE; }

function startBattle(battleId) {
  var def = (scene.battles || {})[battleId];
  if (!def) return;
  var units = {};
  Object.keys(def.units || {}).forEach(function (id) {
    var u = def.units[id];
    units[id] = {
      id: id, name: u.name || id,
      hp: u.hp || 10, maxHp: u.hp || 10,
      atk: u.atk || 3, def: u.def || 0, spd: u.spd || 5,
      move: u.move || 3, range: u.range || 1,
      pos: (u.pos || [0, 0]).slice(),
      side: (def.party || []).indexOf(id) >= 0 ? "party" : "foe",
      atbBar: 0, acted: false
    };
  });
  BATTLE = {
    id: battleId, def: def, type: def.type || "atb", units: units,
    order: [], turnIdx: 0, phase: "select", selected: null, message: "",
    over: false, rng: srandFor("battle:" + battleId)

  if (BATTLE.type === "grid") {
    BATTLE.order = Object.keys(units).sort(function (a, b) { return units[b].spd - units[a].spd; });
    beginGridTurn();
  }
  renderBattle();
}

function livingUnits(side) {
  return Object.keys(BATTLE.units).filter(function (id) {
    var u = BATTLE.units[id];
    return u.hp > 0 && (!side || u.side === side);
  });
}
function checkBattleEnd() {
  if (livingUnits("foe").length === 0) return endBattle(true);
  if (livingUnits("party").length === 0) return endBattle(false);
  return false;
}
function endBattle(won) {
  BATTLE.over = true;
  var def = BATTLE.def;
  if (won && def.rewards) {
    world.flags.xp = (world.flags.xp || 0) + (def.rewards.xp || 0);
    world.flags.gold = (world.flags.gold || 0) + (def.rewards.gold || 0);
    (def.rewards.items || []).forEach(function (id) { invAdd(id, 1); });
  }
  ((won ? def.onWin : def.onLose) || []).forEach(function (a) { runAction(null, a); });
  BATTLE.message = won ? "Victory!" : "Defeated…";
  renderBattle();
  setTimeout(function () {
    BATTLE = null;
    if (battleEl) battleEl.style.display = "none";
  }, 1600);
  return true;
}

// ---- damage formula: (atk^2 / (atk + def)) with small seeded variance ------
function dmg(att, dfd) {
  var base = Math.max(1, Math.round(att.atk * att.atk / (att.atk + dfd.def)));
  return Math.max(1, base + Math.floor(BATTLE.rng() * 3) - 1);

// ---------------------------------------------------------------------------
// GRID BATTLE  -- Tactics. Flood-fill movement, Manhattan attack range.
// ---------------------------------------------------------------------------
function gridAt(x, y) {
  var ids = Object.keys(BATTLE.units);
  for (var i = 0; i < ids.length; i++) {
    var u = BATTLE.units[ids[i]];
    if (u.hp > 0 && u.pos[0] === x && u.pos[1] === y) return u;
  }
  return null;
}
function floodMove(u) {
  var g = BATTLE.def.grid || { w: 8, h: 8 };
  var seen = {}, out = [], q = [[u.pos[0], u.pos[1], 0]];
  seen[u.pos[0] + "," + u.pos[1]] = true;
  while (q.length) {
    var c = q.shift(), x = c[0], y = c[1], d = c[2];
    out.push([x, y]);
    if (d >= u.move) continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function (dxy) {
      var nx = x + dxy[0], ny = y + dxy[1], key = nx + "," + ny;
      if (nx < 0 || ny < 0 || nx >= g.w || ny >= g.h || seen[key]) return;
      var occ = gridAt(nx, ny);
      if (occ && occ.side !== u.side) return; // enemies block, allies pass-through
      seen[key] = true;
      q.push([nx, ny, d + 1]);

  return out.filter(function (c) { return !gridAt(c[0], c[1]) || (c[0] === u.pos[0] && c[1] === u.pos[1]); });
}

}

    BATTLE.turnIdx++;
    var u = BATTLE.units[id];
    if (u && u.hp > 0) {
      BATTLE.active = id;
      BATTLE.phase = u.side === "party" ? "move" : "ai";

}
function gridAiTurn(u) {

  if (!targets.length) return;
  targets.sort(function (a, b) {
    var da = Math.abs(a.pos[0]-u.pos[0]) + Math.abs(a.pos[1]-u.pos[1]);
    var db = Math.abs(b.pos[0]-u.pos[0]) + Math.abs(b.pos[1]-u.pos[1]);
    return da - db;

    if (d < bestD) { bestD = d; best = c; }
  });

    var d2 = dmg(u, tgt);
    tgt.hp = Math.max(0, tgt.hp - d2);

}

  if (!ok) return;

}

  var d = dmg(u, t);
  t.hp = Math.max(0, t.hp - d);
  BATTLE.message = u.name + " hits " + t.name + " for " + d;
  if (!checkBattleEnd()) { beginGridTurn(); }
  renderBattle();
}

  renderBattle();

// ---------------------------------------------------------------------------
// ATB BATTLE  -- FF7-style. Bars fill by spd; full bar = menu turn.
// ---------------------------------------------------------------------------
function updateAtb(dt) {
  if (!BATTLE || BATTLE.type !== "atb" || BATTLE.over) return;
  if (BATTLE.phase === "menu" || BATTLE.phase === "target") return; // pause while choosing
  Object.keys(BATTLE.units).forEach(function (id) {
    var u = BATTLE.units[id];
    if (u.hp <= 0) return;
    u.atbBar += u.spd * dt * 12;
    if (u.atbBar >= 100) {
      u.atbBar = 100;
      if (u.side === "party" && BATTLE.phase === "select") {
        BATTLE.active = id;
        BATTLE.phase = "menu";
        renderBattle();
      } else if (u.side === "foe") {
        atbFoeAct(u);
      }
    }
  });
}
function atbFoeAct(u) {
  var targets = livingUnits("party");
  if (!targets.length) return;
  var t = BATTLE.units[targets[Math.floor(BATTLE.rng() * targets.length)]];
  var d = dmg(u, t);
  t.hp = Math.max(0, t.hp - d);
  u.atbBar = 0;
  BATTLE.message = u.name + " strikes " + t.name + " for " + d;
  checkBattleEnd();
  renderBattle();
}
function atbPlayerAct(action, targetId) {
  var u = BATTLE.units[BATTLE.active];
  if (!u) return;
  if (action === "attack") {
    var t = BATTLE.units[targetId];
    if (!t) return;
    var d = dmg(u, t);
    t.hp = Math.max(0, t.hp - d);
    BATTLE.message = u.name + " attacks " + t.name + " for " + d;
  } else if (action === "item") {
    var it = itemDef(targetId);
    if (invCount(targetId) > 0 && it.heal) {
      invRemove(targetId, 1);
      u.hp = Math.min(u.maxHp, u.hp + it.heal);
      BATTLE.message = u.name + " uses " + (it.name || targetId) + " (+" + it.heal + ")";
    }
  } else if (action === "defend") {
    u._defending = true;
    BATTLE.message = u.name + " guards.";
  }
  u.atbBar = 0;
  BATTLE.active = null;
  BATTLE.phase = "select";
  checkBattleEnd();
  renderBattle();
}

// ---------------------------------------------------------------------------
// BATTLE UI  -- DOM overlay, same pattern as dialogue/shop.
// ---------------------------------------------------------------------------
function renderBattle() {

  if (!battleEl) {

    battleEl.style.cssText = "position:absolute;inset:8px;background:rgba(10,14,20,.96);" +

  }

      'align-items:center;justify-content:center;font-size:9px;cursor:pointer">' +

    if (BATTLE.phase === "act") h += '<div data-wait="1" style="display:inline-block;margin-top:5px;padding:5px 10px;background:#3f5c6b;border-radius:4px;cursor:pointer">Wait</div>';

    h += '<div style="margin-top:8px">';
    h += '<div data-act="attack" style="padding:6px 10px;margin-top:3px;background:#8c4a42;border-radius:4px;cursor:pointer">Attack</div>';
    var heals = Object.keys(INV.items).filter(function (id) { return itemDef(id).heal; });
    heals.forEach(function (id) {
      h += '<div data-act="item" data-t="' + id + '" style="padding:6px 10px;margin-top:3px;background:#3f6b5c;border-radius:4px;cursor:pointer">' +
        (itemDef(id).name || id) + " x" + invCount(id) + "</div>";
    });
    h += '<div data-act="defend" style="padding:6px 10px;margin-top:3px;background:#3f5c6b;border-radius:4px;cursor:pointer">Defend</div>';
    h += "</div>";
  } else if (BATTLE.phase === "target") {
    h += '<div style="margin-top:8px;color:#8a8a8a">Choose a target:</div>';
    livingUnits("foe").forEach(function (id) {
      h += '<div data-target="' + id + '" style="padding:6px 10px;margin-top:3px;background:#8c4a42;border-radius:4px;cursor:pointer">' +
        BATTLE.units[id].name + "</div>";
    });
  }
  return h;
}
function unitBars(withAtb) {
  var h = '<div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px">';
  ["party", "foe"].forEach(function (side) {
    h += "<div>";
    livingUnits(side).concat(Object.keys(BATTLE.units).filter(function (id) {
      return BATTLE.units[id].side === side && BATTLE.units[id].hp <= 0;
    })).forEach(function (id) {
      var u = BATTLE.units[id];
      var pct = Math.round(u.hp / u.maxHp * 100);
      h += '<div style="margin-bottom:4px;opacity:' + (u.hp > 0 ? 1 : 0.35) + '">' +
        '<div style="font-size:10px">' + u.name + " " + u.hp + "/" + u.maxHp + "</div>" +
        '<div style="height:5px;background:#171d28;border-radius:2px"><div style="height:5px;width:' + pct +
        '%;background:' + (side === "party" ? "#49c07a" : "#a3564f") + ';border-radius:2px"></div></div>';
      if (withAtb && u.hp > 0) {

          '<div style="height:3px;width:' + Math.round(u.atbBar) + '%;background:#c9b48a;border-radius:2px"></div></div>';
      }

    });

}
function battleClick(e) {
  if (!BATTLE || BATTLE.over) return;
  var t = e.target.closest ? e.target.closest("[data-cell],[data-act],[data-target],[data-wait]") : e.target;
  if (!t || !t.getAttribute) return;
  if (BATTLE.type === "grid") {
    if (t.getAttribute("data-wait")) return gridPlayerWait();
    var cell = t.getAttribute("data-cell");
    if (!cell) return;
    var xy = cell.split(",").map(Number);
    if (BATTLE.phase === "move") {
      var unit = t.getAttribute("data-unit");
      var u = BATTLE.units[BATTLE.active];
      // clicking an adjacent enemy from move phase = move-in-place then attack
      if (unit && BATTLE.units[unit].side !== u.side && inAttackRange(u, BATTLE.units[unit])) {
        BATTLE.phase = "act";
        return gridPlayerAttack(unit);
      }
      return gridPlayerMove(xy[0], xy[1]);
    }
    if (BATTLE.phase === "act") {
      var unit2 = t.getAttribute("data-unit");
      if (unit2) return gridPlayerAttack(unit2);
    }
  } else {
    var act = t.getAttribute("data-act");
    if (act === "attack") { BATTLE.phase = "target"; return renderBattle(); }
    if (act === "item") return atbPlayerAct("item", t.getAttribute("data-t"));
    if (act === "defend") return atbPlayerAct("defend");
    var tgt = t.getAttribute("data-target");
    if (tgt) return atbPlayerAct("attack", tgt);
  }
}

// ---------------------------------------------------------------------------
// MENU SYSTEM  -- pause overlay bound to tables: status / inventory / save.
// Opened by action {action:"openMenu"} or the M key.
// ---------------------------------------------------------------------------
var MENU = null, menuEl = null;
function openMenu() { MENU = { tab: "status" }; renderMenu(); }
function closeMenu() { MENU = null; if (menuEl) menuEl.style.display = "none"; }
function renderMenu() {
  if (!MENU) return;
  if (!menuEl) {
    menuEl = document.createElement("div");
    menuEl.style.cssText = "position:absolute;inset:8px;background:rgba(10,14,20,.96);" +
      "border:1px solid #3f5c6b;border-radius:8px;padding:12px;color:#e8e2d0;" +
      "font-size:13px;overflow:auto;pointer-events:auto";
    hud.appendChild(menuEl);
  }
  var pl = nodes[playerId] || {};
  var h = '<div style="display:flex;gap:6px;margin-bottom:10px">';
  ["status", "items", "save"].forEach(function (tab) {
    h += '<div data-tab="' + tab + '" style="padding:5px 12px;border-radius:4px;cursor:pointer;background:' +
      (MENU.tab === tab ? "#3f5c6b" : "#171d28") + '">' + tab + "</div>";
  });
  h += '<div data-x="1" style="margin-left:auto;padding:5px 12px;background:#8c4a42;border-radius:4px;cursor:pointer">close</div></div>';

  if (MENU.tab === "status") {
    h += "<div>HP " + (pl.hp || 0) + "/" + (pl.maxHp || 0) + "</div>";
    h += "<div>Level " + playerLevel() + " &nbsp; XP " + (world.flags.xp || 0) + "</div>";
    h += "<div>Gold " + gold() + "</div>";
    h += "<div>ATK " + derivedStat((pl.stats && pl.stats.attack) || 0, "atk") +
      " &nbsp; DEF " + derivedStat(0, "def") + "</div>";
    var eq = Object.keys(INV.equipped).map(function (sl) { return sl + ": " + (itemDef(INV.equipped[sl]).name || INV.equipped[sl]); });
    if (eq.length) h += '<div style="margin-top:6px;color:#8a8a8a">' + eq.join(" · ") + "</div>";
  } else if (MENU.tab === "items") {
    var ids = Object.keys(INV.items);
    if (!ids.length) h += '<div style="color:#8a8a8a">Empty.</div>';
    ids.forEach(function (id) {
      var it = itemDef(id);
      h += '<div data-use="' + id + '" style="display:flex;justify-content:space-between;padding:6px 8px;' +
        'margin-top:4px;background:#1b2430;border-radius:4px;cursor:pointer">' +
        "<span>" + (it.name || id) + " x" + invCount(id) + "</span>" +
        '<span style="color:#8a8a8a;font-size:11px">' + (it.kind === "weapon" || it.kind === "trinket" ? "equip" : (it.heal ? "use" : "")) + "</span></div>";
    });
  } else if (MENU.tab === "save") {
    h += '<div data-save="1" style="padding:8px 12px;background:#3f6b5c;border-radius:4px;cursor:pointer;display:inline-block">Save progress</div>';
    if (MENU.saved) h += '<div style="margin-top:6px;color:#49c07a">Saved.</div>';
  }
  menuEl.innerHTML = h;
  menuEl.style.display = "block";
  menuEl.onclick = function (e) {
    var t = e.target.closest ? e.target.closest("[data-tab],[data-x],[data-use],[data-save]") : e.target;
    if (!t || !t.getAttribute) return;
    if (t.getAttribute("data-x")) return closeMenu();
    var tab = t.getAttribute("data-tab");
    if (tab) { MENU.tab = tab; MENU.saved = false; return renderMenu(); }
    var use = t.getAttribute("data-use");
    if (use) {
      var it = itemDef(use);
      var pl2 = nodes[playerId];
      if (it.kind === "weapon" || it.kind === "trinket") equip(it.kind === "weapon" ? "weapon" : "trinket", use);
      else if (it.heal && pl2) { invRemove(use, 1); pl2.hp = Math.min(pl2.maxHp || 999, (pl2.hp || 0) + it.heal); }
      return renderMenu();
    }
    if (t.getAttribute("data-save")) { bridgeCommit(); MENU.saved = true; return renderMenu(); }
  };
}

// ---------------------------------------------------------------------------
// v4: SHOOTER + STEALTH SET  -- projectiles, lock-on, vision cones, stimuli.
// ---------------------------------------------------------------------------

// ---- occluders: MeshInstances with collision block sight lines -------------
// ---------------------------------------------------------------------------
// PHYSICS (v6) -- Bullet-style rigid bodies. Fixed 60Hz substeps decoupled
// from render dt so simulation is deterministic; sequential impulse solver
// with Baumgarte positional correction; uniform-grid broadphase; bodies sleep.
// Declared per node:  physics: { body:"dynamic"|"static"|"kinematic",
//   shape:"sphere"|"box"|"capsule", radius, half:[x,y,z], height,
//   mass, restitution, friction, gravityScale }
// ---------------------------------------------------------------------------
var BODIES = [];
var PHYS = { gravity: -20, fixedDt: 1 / 60, accum: 0, maxSteps: 5, iterations: 12,
             sleepVel: 0.08, sleepTime: 0.5, slop: 0.01, baumgarte: 0.5, cell: 2.0 };
var PB_GROUND = { invMass: 0, vel: { x: 0, y: 0, z: 0 }, rest: 0, fric: 0.9, node: {} };

function physRegister(n) {
  var p = n.physics || {};
  n._pb = {
    node: n,
    kind: p.body || "dynamic",
    shape: p.shape || "sphere",
    r: p.radius != null ? p.radius : 0.4,
    half: p.half || [0.5, 0.5, 0.5],
    h: p.height != null ? p.height : 1.6,
    mass: (p.body === "static" || p.body === "kinematic") ? 0 : (p.mass != null ? p.mass : 1),
    rest: p.restitution != null ? p.restitution : 0.2,
    fric: p.friction != null ? p.friction : 0.5,
    gs: p.gravityScale != null ? p.gravityScale : 1,
    vel: { x: 0, y: 0, z: 0 },
    sleep: 0, asleep: false
  };
  n._pb.invMass = n._pb.mass > 0 ? 1 / n._pb.mass : 0;
  BODIES.push(n._pb);
}

function pbPos(b) {
  var t = b.node.transform || (b.node.transform = {});
  t.pos = t.pos || [0, 0, 0];
  return t.pos;
}
function pbWake(b) { b.asleep = false; b.sleep = 0; }
function physImpulse(n, x, y, z) {
  var b = n._pb; if (!b || b.invMass === 0) return;
  b.vel.x += x * b.invMass; b.vel.y += y * b.invMass; b.vel.z += z * b.invMass;
  pbWake(b);
}
function physSetVel(n, x, y, z) {
  var b = n._pb; if (!b) return;
  b.vel.x = x; b.vel.y = y; b.vel.z = z; pbWake(b);
}

// --- shape radius helpers (broadphase bound) -------------------------------
function pbBound(b) {
  if (b.shape === "box") return Math.sqrt(b.half[0]*b.half[0] + b.half[1]*b.half[1] + b.half[2]*b.half[2]);
  if (b.shape === "capsule") return b.r + b.h * 0.5;
  return b.r;
}

// --- narrowphase: returns { nx, ny, nz, depth } or null ---------------------
// Sphere/capsule treated as swept spheres on the Y axis; box uses closest-point.
// Axis-aligned box vs box: overlap on all three axes, separate along the
// axis of least penetration. Boxes do not rotate in this solver, which is
// period-correct and keeps the contact cheap.
function pbBoxBox(a, b) {
  var pa = pbPos(a), pb = pbPos(b);
  var dx = pb[0] - pa[0], ox = (a.half[0] + b.half[0]) - Math.abs(dx);
  if (ox <= 0) return null;
  var dy = pb[1] - pa[1], oy = (a.half[1] + b.half[1]) - Math.abs(dy);
  if (oy <= 0) return null;
  var dz = pb[2] - pa[2], oz = (a.half[2] + b.half[2]) - Math.abs(dz);
  if (oz <= 0) return null;
  if (oy <= ox && oy <= oz) return { nx: 0, ny: dy < 0 ? -1 : 1, nz: 0, depth: oy };
  if (ox <= oz) return { nx: dx < 0 ? -1 : 1, ny: 0, nz: 0, depth: ox };
  return { nx: 0, ny: 0, nz: dz < 0 ? -1 : 1, depth: oz };
}

function pbContact(a, b) {
  var pa = pbPos(a), pb = pbPos(b);
  var ax = pa[0], ay = pa[1], az = pa[2];
  var bx = pb[0], by = pb[1], bz = pb[2];

  if (a.shape === "box" && b.shape === "box") return pbBoxBox(a, b);
  if (a.shape === "box" || b.shape === "box") {
    var boxB = (b.shape === "box") ? b : a;
    var sph  = (b.shape === "box") ? a : b;
    var bp = pbPos(boxB), sp = pbPos(sph);
    var hx = boxB.half[0], hy = boxB.half[1], hz = boxB.half[2];
    var cx = Math.max(bp[0] - hx, Math.min(sp[0], bp[0] + hx));
    var cy = Math.max(bp[1] - hy, Math.min(sp[1], bp[1] + hy));
    var cz = Math.max(bp[2] - hz, Math.min(sp[2], bp[2] + hz));
    var dx = sp[0] - cx, dy = sp[1] - cy, dz = sp[2] - cz;
    var d2 = dx*dx + dy*dy + dz*dz;
    var sr = sph.shape === "capsule" ? sph.r : sph.r;
    if (d2 > sr * sr) return null;
    var d = Math.sqrt(d2);
    if (d < 1e-6) { dx = 0; dy = 1; dz = 0; d = 1; }
    var n = { nx: dx / d, ny: dy / d, nz: dz / d, depth: sr - d };
    if (boxB === b) return n;
    return { nx: -n.nx, ny: -n.ny, nz: -n.nz, depth: n.depth };
  }

  // sphere/capsule vs sphere/capsule: clamp Y onto each segment
  var ah = a.shape === "capsule" ? a.h * 0.5 : 0;
  var bh = b.shape === "capsule" ? b.h * 0.5 : 0;
  var ayc = Math.max(ay - ah, Math.min(by, ay + ah));
  var byc = Math.max(by - bh, Math.min(ayc, by + bh));
  var dx2 = bx - ax, dy2 = byc - ayc, dz2 = bz - az;
  var rr = a.r + b.r;
  var dd = dx2*dx2 + dy2*dy2 + dz2*dz2;
  if (dd > rr * rr) return null;
  var dl = Math.sqrt(dd);
  if (dl < 1e-6) { dx2 = 0; dy2 = 1; dz2 = 0; dl = 1; }
  return { nx: dx2 / dl, ny: dy2 / dl, nz: dz2 / dl, depth: rr - dl };
}

// --- broadphase: uniform grid on xz ----------------------------------------
function pbPairs() {
  var grid = {}, pairs = [], i, j;
  for (i = 0; i < BODIES.length; i++) {
    var b = BODIES[i];
    if (b.node._dead) continue;
    var p = pbPos(b), rad = pbBound(b);
    var x0 = Math.floor((p[0] - rad) / PHYS.cell), x1 = Math.floor((p[0] + rad) / PHYS.cell);
    var z0 = Math.floor((p[2] - rad) / PHYS.cell), z1 = Math.floor((p[2] + rad) / PHYS.cell);
    for (var gx = x0; gx <= x1; gx++) for (var gz = z0; gz <= z1; gz++) {
      var k = gx + ":" + gz;
      (grid[k] = grid[k] || []).push(i);
    }
  }
  var seen = {};
  for (var key in grid) {
    var cell = grid[key];
    for (i = 0; i < cell.length; i++) for (j = i + 1; j < cell.length; j++) {
      var A = BODIES[cell[i]], B = BODIES[cell[j]];
      if (A.invMass === 0 && B.invMass === 0) continue;
      if (A.asleep && B.asleep) continue;
      var pk = cell[i] < cell[j] ? cell[i] + "_" + cell[j] : cell[j] + "_" + cell[i];
      if (seen[pk]) continue;
      seen[pk] = 1;
      pairs.push([A, B]);
    }
  }
  return pairs;
}

// --- one fixed step --------------------------------------------------------
function physContacts() {
  var contacts = [], i, b;
  var pairs = pbPairs();
  for (i = 0; i < pairs.length; i++) {
    var c = pbContact(pairs[i][0], pairs[i][1]);
    if (c) { c.a = pairs[i][0]; c.b = pairs[i][1]; contacts.push(c); }
  }
  // The floor is a static contact so the solver, not a clamp, carries
  // resting weight. Included at touch distance (small negative depth) so the
  // velocity solve catches bodies the moment they land.
  for (i = 0; i < BODIES.length; i++) {
    b = BODIES[i];
    if (b.invMass === 0 || b.asleep || b.node._dead) continue;
    var gp = pbPos(b);
    var gfloor = terrainHeight(gp[0], gp[2]);
    var gfoot = b.shape === "box" ? b.half[1] : (b.shape === "capsule" ? b.h * 0.5 + b.r : b.r);
    var gd = (gfloor + gfoot) - gp[1];
    if (gd > -0.02) contacts.push({ a: PB_GROUND, b: b, nx: 0, ny: 1, nz: 0, depth: Math.max(gd, 0) });
  }
  contacts.sort(function (u, v) {
    var uy = Math.min(u.a.invMass === 0 ? -1e9 : pbPos(u.a)[1], u.b.invMass === 0 ? -1e9 : pbPos(u.b)[1]);
    var vy = Math.min(v.a.invMass === 0 ? -1e9 : pbPos(v.a)[1], v.b.invMass === 0 ? -1e9 : pbPos(v.b)[1]);
    return uy - vy;
  });
  return contacts;
}

function physStep(h) {
  var i, b;
  // 1. gravity
  for (i = 0; i < BODIES.length; i++) {
    b = BODIES[i];
    if (b.invMass === 0 || b.asleep || b.node._dead) continue;
    b.vel.y += PHYS.gravity * b.gs * h;
  }
  // 2. contacts at current positions
  var contacts = physContacts();
  // 3. velocity solve BEFORE integrating, so resting bodies never sink
  for (var it = 0; it < PHYS.iterations; it++) {
    for (i = 0; i < contacts.length; i++) {
      var ct = contacts[i], A = ct.a, B = ct.b;
      var im = A.invMass + B.invMass;
      if (im === 0) continue;
      var rvx = B.vel.x - A.vel.x, rvy = B.vel.y - A.vel.y, rvz = B.vel.z - A.vel.z;
      var vn = rvx * ct.nx + rvy * ct.ny + rvz * ct.nz;
      if (vn > 0) continue;
      var e = Math.min(A.rest, B.rest);
      if (vn > -1.0) e = 0; // slow contact: absorb, never micro-bounce
      var jn = -(1 + e) * vn / im;
      A.vel.x -= jn * ct.nx * A.invMass; A.vel.y -= jn * ct.ny * A.invMass; A.vel.z -= jn * ct.nz * A.invMass;
      B.vel.x += jn * ct.nx * B.invMass; B.vel.y += jn * ct.ny * B.invMass; B.vel.z += jn * ct.nz * B.invMass;
      rvx = B.vel.x - A.vel.x; rvy = B.vel.y - A.vel.y; rvz = B.vel.z - A.vel.z;
      vn = rvx * ct.nx + rvy * ct.ny + rvz * ct.nz;
      var tx = rvx - vn * ct.nx, ty = rvy - vn * ct.ny, tz = rvz - vn * ct.nz;
      var tl = Math.sqrt(tx * tx + ty * ty + tz * tz);
      if (tl > 1e-6) {
        tx /= tl; ty /= tl; tz /= tl;
        var mu = Math.sqrt(A.fric * B.fric);
        var jt = -tl / im;
        var maxJt = Math.abs(jn) * mu;
        if (jt < -maxJt) jt = -maxJt; else if (jt > maxJt) jt = maxJt;
        A.vel.x -= jt * tx * A.invMass; A.vel.y -= jt * ty * A.invMass; A.vel.z -= jt * tz * A.invMass;
        B.vel.x += jt * tx * B.invMass; B.vel.y += jt * ty * B.invMass; B.vel.z += jt * tz * B.invMass;
      }
    }
  }
  // shock propagation: contacts are sorted bottom-up, so one pass with the
  // lower body frozen removes the residual the iterative solver leaves in
  // tall stacks. Upper body normal velocity is lifted to the lower one.
  for (i = 0; i < contacts.length; i++) {
    var sc = contacts[i];
    var la, ua; // lower, upper
    if (sc.a.invMass === 0) { la = sc.a; ua = sc.b; }
    else if (sc.b.invMass === 0) { la = sc.b; ua = sc.a; }
    else if (pbPos(sc.a)[1] <= pbPos(sc.b)[1]) { la = sc.a; ua = sc.b; }
    else { la = sc.b; ua = sc.a; }
    if (ua.invMass === 0) continue;
    // normal pointing lower -> upper
    var sx = sc.nx, sy = sc.ny, sz = sc.nz;
    if (ua === sc.a) { sx = -sx; sy = -sy; sz = -sz; }
    var vnU = ua.vel.x * sx + ua.vel.y * sy + ua.vel.z * sz;
    var vnL = la.vel.x * sx + la.vel.y * sy + la.vel.z * sz;
    if (vnU < vnL) {
      var dl = vnL - vnU;
      ua.vel.x += sx * dl; ua.vel.y += sy * dl; ua.vel.z += sz * dl;
    }
  }
  // 4. integrate positions with solved velocities
  for (i = 0; i < BODIES.length; i++) {
    b = BODIES[i];
    if (b.invMass === 0 || b.asleep || b.node._dead) continue;
    var p = pbPos(b);
    p[0] += b.vel.x * h; p[1] += b.vel.y * h; p[2] += b.vel.z * h;
  }
  // 5. positional passes: recompute contacts and relax residual overlap.
  // Impact wake + collision signals fire on the first pass only.
  for (var pc = 0; pc < 3; pc++) {
    contacts = physContacts();
    var moved = false;
    for (i = 0; i < contacts.length; i++) {
      var q = contacts[i], Aa = q.a, Bb = q.b;
      var imm = Aa.invMass + Bb.invMass;
      if (imm === 0) continue;
      if (pc === 0) {
        var wx = Bb.vel.x - Aa.vel.x, wy = Bb.vel.y - Aa.vel.y, wz = Bb.vel.z - Aa.vel.z;
        var wn = wx * q.nx + wy * q.ny + wz * q.nz;
        if (wn < -0.5) { pbWake(Aa); pbWake(Bb); }
        if (q.depth > 0) { physCollideSignal(Aa.node, Bb.node); physCollideSignal(Bb.node, Aa.node); }
      }
      var corr = Math.max(q.depth - PHYS.slop, 0) / imm * PHYS.baumgarte;
      if (corr <= 0) continue;
      moved = true;
      var ap = Aa.invMass > 0 ? pbPos(Aa) : null, bp2 = Bb.invMass > 0 ? pbPos(Bb) : null;
      if (ap) { ap[0] -= corr * q.nx * Aa.invMass; ap[1] -= corr * q.ny * Aa.invMass; ap[2] -= corr * q.nz * Aa.invMass; }
      if (bp2) { bp2[0] += corr * q.nx * Bb.invMass; bp2[1] += corr * q.ny * Bb.invMass; bp2[2] += corr * q.nz * Bb.invMass; }
    }
    if (!moved) break;
  }
  // 6. sleeping
  for (i = 0; i < BODIES.length; i++) {
    b = BODIES[i];
    if (b.invMass === 0 || b.node._dead) continue;
    var sp2 = Math.sqrt(b.vel.x * b.vel.x + b.vel.y * b.vel.y + b.vel.z * b.vel.z);
    if (sp2 < PHYS.sleepVel) {
      b.sleep += h;

  var forbidden = ["script", "eval", "fetch", "url", "endpoint", "html", "src", "onload", "href"];
  var bad = null;
  (function keys(o, depth) {
    if (bad || !o || typeof o !== "object" || depth > 16) return;
    if (Array.isArray(o)) { o.forEach(function (x) { keys(x, depth + 1); }); return; }
    Object.keys(o).forEach(function (k) {
      if (forbidden.indexOf(k.toLowerCase()) >= 0) { bad = k; return; }
      keys(o[k], depth + 1);
    });
  })(s, 0);
  if (bad) return "forbidden key: " + bad;
  var known = ["identity", "stats", "balance", "persist"];
  var perms = s.permissions || [];
  if (!Array.isArray(perms)) return "permissions must be an array";
  for (var pi = 0; pi < perms.length; pi++) {
    if (known.indexOf(perms[pi]) < 0) return "unknown permission: " + perms[pi];
  }
  return null;
}

// ---------------------------------------------------------------------------
// BOOT / LOOP
// ---------------------------------------------------------------------------
function resize() {
  var r = scene && scene.render ? scene.render : {};
  W = r.internalWidth || 320; H = r.internalHeight || 240;
  canvas.width = W; canvas.height = H;
  ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
}

function loadScene(json) {
  try {
    scene = typeof json === "string" ? JSON.parse(json) : json;
  } catch (e) { return fail("scene JSON parse error: " + e.message); }
  var v = validate(scene);
  if (v) return fail("scene rejected: " + v);

  nodes = {}; actors = []; meshCache = {}; texCache = {}; backdropCache = {};
  scene._backdrop = null; scene._walkmesh = null; scene._tilemap = null;
  BODIES = []; PHYS.accum = 0;
  ALARMS = [];
  POSED.forEach(function (a) { a._pose = null; }); POSED = [];
  RAGDOLLS = [];
  BAKE = { done: false, occluders: [], ambient: null };
  // node-level bakes are discarded with the node table on load
  playerId = null; camera = null; terrainMesh = null;
  world = { alert: false, flags: {}, score: 0, time: 0 };
  INV = { items: {}, equipped: {} };
  DLG = null; SHOP = null;
  if (dlgEl) dlgEl.style.display = "none";
  if (shopEl) shopEl.style.display = "none";
  ENC = { steps: 0, threshold: 0, zone: null, rng: null };
  BATTLE = null; MENU = null;
  STIMULI = []; PROJECTILES = []; LOCK = { target: null };
  world._alertT = 0;
  if (battleEl) battleEl.style.display = "none";
  if (menuEl) menuEl.style.display = "none";
  rnd = mulberry(hashStr(scene.meta.seed || "kv"));

  scene.resources = scene.resources || {};
  resize();
  walkNodes(scene.nodes, null);
  actors.forEach(function (a) { if (a.stateMachine) enterState(a, a.stateMachine.initial); });
  buildHud();
  updateTransforms(scene.nodes, matIdent());
  initSession();
  // world matrices must exist before baking: vertices are lit in world space
  updateTransforms(scene.nodes, matIdent());
  if (scene.lighting) bakeLighting();
  conSetup();
  post({ kv: "ready", id: scene.meta.id, permissions: scene.permissions || [] });
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function fail(msg) {
  running = false;
  var el = document.getElementById("err");
  el.style.display = "block";
  el.textContent = msg;
  post({ kv: "error", message: msg });
}

// Every per-frame simulation system, in order. loop() and the headless test
// harness both call this, so a new system cannot be live in the engine but
// missing from the regression suite.
function stepSystems(dt) {
  updateRagdolls();
  updatePoseClips(dt);
  updateAlarms(dt);
  updatePhysics(dt);
  updateAnims(dt);
  updateTransforms(scene.nodes, matIdent());
  if (!dialogueOpen() && !SHOP && !battleOpen() && !MENU) {
    actors.forEach(function (a) { if (!a._dead) updateActor(a, dt); });
  }
  updateAtb(dt);
  if (!battleOpen() && !MENU) updateEncounters(dt);
  if (!dialogueOpen() && !SHOP && !battleOpen() && !MENU) {
    updateStimuli(dt);
    updateAlert(dt);
    updateProjectiles(dt);
    updateLock();
  }
  updateTransforms(scene.nodes, matIdent());
}

function loop(t) {
  if (!running) return;
  // Clamp both ends: negative deltas (clock skew, tab restore) would otherwise
  // run the whole simulation backwards, and long stalls would tunnel actors.
  var dt = Math.max(0, Math.min(0.05, (t - lastT) / 1000));
  lastT = t;
  world.time += dt;

  INPUT.move.x = 0; INPUT.move.y = 0; INPUT.move.length = 0;
  pollKeys();
  edgeFlush();

  stepSystems(dt);
  buildView();
  updateAreas();
  renderFrame();
  updateHud();

  requestAnimationFrame(loop);
}

// entry
canvas = document.getElementById("view");
hud = document.getElementById("hud");
pad = document.getElementById("pad");
ctx = canvas.getContext("2d");
setupInput();

window.addEventListener("message", function (e) {
  try {
    var m = JSON.parse(e.data);
    if (m.kv === "load") loadScene(m.scene);
    else if (m.kv === "sdkResult") KV.resolve(m.id, m.result);
  } catch (err) {}
});
document.addEventListener("message", function (e) {
  try {
    var m = JSON.parse(e.data);
    if (m.kv === "load") loadScene(m.scene);
    else if (m.kv === "sdkResult") KV.resolve(m.id, m.result);
  } catch (err) {}
});
