[package]
name = "kasvillage-townhall"
version = "4.0.0"
edition = "2021" 
authors = ["KasVillage"]
description = "Complete Town Hall with  real Halo2 SNARK"

[dependencies]
# Halo2 - PSE fork with IPA
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", tag = "v2023_04_20" }

# Pasta curves (includes ff traits)
pasta_curves = "0.5"

# Field traits
ff = { version = "0.13", features = ["derive"] }

# Hashing
blake2 = "0.10"
sha2 = "0.10"
hex = "0.4"

# Secp256k1 for ECDSA (Arweave ANS-104 signing)
secp256k1 = { version = "0.29", features = ["global-context"] }

# Random
rand = "0.8"

# Web framework
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Utilities
regex = "1"
once_cell = "1"
chrono = "0.4"
env_logger = "0.11"
base64 = "0.21"
log = "0.4"

[dev-dependencies]
criterion = "0.5"

[profile.dev]
opt-level = 0
debug = true
# K=12, TREE_DEPTH=8 (fast)

[profile.release]
opt-level = 3
lto = true
# K=17, TREE_DEPTH=32 (production)

# Optional: for production DKIM with full RSA
# rsa = "0.9"
# pkcs8 = "0.10"
# trust-dns-resolver = "0.23"
