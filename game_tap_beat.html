<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tap Beat</title>
<style>
  :root { --bg:#16110c; --panel:#221a12; --line:#3a2e20; --ink:#f3e9d8; --mut:#a8987e;
          --k:#ff5ec8; --s:#4ade80; --h:#f4c84a; --c:#60a5fa; --b:#c084fc; --g:#fb923c; --v:#2dd4bf; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
              font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { max-width:480px; margin:0 auto; padding:14px 14px 20px; display:flex; flex-direction:column; gap:12px; min-height:100%; }
  h1 { margin:4px 0 0; font-size:22px; letter-spacing:2px; text-align:center; }
  #sub { text-align:center; color:var(--mut); font-size:13px; min-height:18px; }
  #bar { height:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  #fill { height:100%; width:0; background:linear-gradient(90deg,var(--k),var(--h)); transition:width .1s linear; }
  #grid { display:grid; grid-template-columns:repeat(16,1fr); gap:3px; background:var(--panel);
          border:1px solid var(--line); border-radius:12px; padding:8px; }
  .cell { aspect-ratio:1; border-radius:3px; background:#2e2418; }
  .cell.on-k { background:var(--k); } .cell.on-s { background:var(--s); }
  .cell.on-h { background:var(--h); } .cell.on-c { background:var(--c); }
  .cell.on-b { background:var(--b); } .cell.on-g { background:var(--g); } .cell.on-v { background:var(--v); }
  .cell.now { outline:2px solid #fff; outline-offset:-1px; }
  #pads { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; min-height:110px; }
  #mel { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; flex:1; min-height:130px; }
  .lbl { color:var(--mut); font-size:11px; letter-spacing:2px; margin:-4px 0 -6px 2px; }
  .pad { border:none; border-radius:16px; font-size:15px; font-weight:800; color:#16110c;
         letter-spacing:1px; transition:transform .06s, filter .06s; touch-action:manipulation; }
  .pad:active, .pad.hit { transform:scale(.95); filter:brightness(1.35); }
  #k { background:var(--k); } #s { background:var(--s); } #h { background:var(--h); } #c { background:var(--c); }
  #b { background:var(--b); } #g { background:var(--g); } #v { background:var(--v); }
  #fx { display:flex; gap:8px; }
  .fx { flex:1; padding:12px 6px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
        color:var(--ink); font-size:14px; font-weight:700; }
  .fx.on { border-color:var(--k); color:var(--k); box-shadow:0 0 10px #ff5ec866; }
  #go { padding:14px; border-radius:12px; border:none; background:var(--k); color:#16110c;
        font-size:17px; font-weight:800; letter-spacing:1px; }
  #nowLayer { position:fixed; inset:0; pointer-events:none; z-index:4; }
  .now { position:absolute; width:96px; height:96px; margin:-48px 0 0 -48px; border-radius:50%;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         color:#16110c; font-weight:900; pointer-events:auto; border:3px solid #fff;
         box-shadow:0 0 22px currentColor; animation:pop .14s ease-out; touch-action:manipulation; }
  .now b { font-size:22px; letter-spacing:1px; } .now i { font-style:normal; font-size:10px; letter-spacing:1px; }
  .now.gone { animation:fade .2s forwards; pointer-events:none; }
  .fb { position:absolute; transform:translate(-50%,-50%); font-weight:900; font-size:18px; color:#fff;
        text-shadow:0 0 10px var(--k); animation:rise .7s forwards; pointer-events:none; }
  #score { text-align:center; font-weight:800; letter-spacing:2px; color:var(--h); min-height:20px; }
  @keyframes pop { from { transform:scale(.3); } to { transform:scale(1); } }
  @keyframes fade { to { transform:scale(1.4); opacity:0; } }
  @keyframes rise { to { transform:translate(-50%,-160%); opacity:0; } }
  #win { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
         background:#16110cdd; z-index:5; pointer-events:none; }
  #win.show { display:flex; }
  #win b { font-size:56px; letter-spacing:6px; color:var(--h);
           text-shadow:0 0 18px var(--k), 0 0 36px var(--k); animation:pulse .9s ease-in-out infinite alternate; }
  #win span { margin-top:10px; color:var(--ink); font-size:15px; }
  @keyframes pulse { from { transform:scale(1); } to { transform:scale(1.08); } }
</style>
</head>
<body>
<div id="app">
  <h1>TAP BEAT</h1>
  <div id="sub">Tap START, then tap the pads. Your taps join the loop.</div>
  <div id="score"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="grid"></div>
  <div class="lbl">DRUMS</div>
  <div id="pads">
    <button class="pad" id="k">KICK</button>
    <button class="pad" id="s">SNARE</button>
    <button class="pad" id="h">HAT</button>
    <button class="pad" id="c">CLAP</button>
  </div>
  <div class="lbl">BAND</div>
  <div id="mel">
    <button class="pad" id="b">BASS</button>
    <button class="pad" id="g">GUITAR</button>
    <button class="pad" id="v">VOICE</button>
  </div>
  <div id="fx">
    <button class="fx" id="fxEcho">ECHO</button>
    <button class="fx" id="fxSweep">SWEEP</button>
  </div>
  <button id="go">START</button>
</div>
<div id="nowLayer"></div>
<div id="win"><b>VICTORY</b><span id="winTxt">Your beat is looping. Tap START to make a new one.</span></div>
<script>
(function () {
  'use strict';
  var BPM = 100, STEPS = 32, ROUND_MS = 30000;
  var STEP_S = 60 / BPM / 4;                 // sixteenth notes
  var VOICES = ['k', 's', 'h', 'c', 'b', 'g', 'v'];
  var MELODIC = { b: 1, g: 1, v: 1 };
  var A = 110, PENTA = [0, 3, 5, 7, 10];        // A minor pentatonic, semitones
  function note(deg, oct) { var o = Math.floor(deg / 5), d = ((deg % 5) + 5) % 5; return A * Math.pow(2, oct + o + PENTA[d] / 12); }
  var RIFF = {                                   // each tap plays the next note of its riff
    b: [0, 0, 1, 4, 0, 3, 2, 1].map(function (d) { return note(d, -1); }),
    g: [0, 1, 2, 4, 0, 2, 3, 1].map(function (d) { return note(d, 0); }),
    v: [3, 4, 5, 6, 5, 4, 3, 2].map(function (d) { return note(d, 1); })
  };
  var riffAt = { b: 0, g: 0, v: 0 };
  var ac = null, master, dry, echoSend, echoDelay, echoFb, filt;
  var pattern = {}, step = 0, nextT = 0, timer = null, state = 'idle', t0 = 0, uiTimer = null;
  var echoOn = false, sweepOn = false;
  var score = 0, perfects = 0, combo = 0;
  var NAMES = { k: 'KICK', s: 'SNARE', h: 'HAT', c: 'CLAP', b: 'BASS', g: 'GUITAR', v: 'VOICE' };
  var COLORS = { k: '#ff5ec8', s: '#4ade80', h: '#f4c84a', c: '#60a5fa', b: '#c084fc', g: '#fb923c', v: '#2dd4bf' };
  var NOW_EVERY = 8;            // a NOW bubble every half bar (8 sixteenths)
  var NOW_LIFE = 0.75;          // seconds it stays tappable

  // ---- grid (built with DOM nodes; 2 rows of 16 = 2 bars) ----
  var grid = document.getElementById('grid'), cells = [];
  for (var i = 0; i < STEPS; i++) { var d = document.createElement('div'); d.className = 'cell'; grid.appendChild(d); cells.push(d); }
  function clearPattern() { pattern = {}; VOICES.forEach(function (v) { pattern[v] = new Array(STEPS).fill(false); }); paint(); }
  function paint() {
    for (var i = 0; i < STEPS; i++) {
      var cls = 'cell';
      for (var j = VOICES.length - 1; j >= 0; j--) if (pattern[VOICES[j]][i]) { cls += ' on-' + VOICES[j]; break; }
      if (state !== 'idle' && i === (step + STEPS - 1) % STEPS) cls += ' now';
      cells[i].className = cls;
    }
  }

  // ---- audio graph: voices -> filter -> (dry + echo) -> master ----
  function initAudio() {
    if (ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    var lim = ac.createDynamicsCompressor(); lim.threshold.value = -6; lim.ratio.value = 12; lim.attack.value = 0.003; lim.release.value = 0.15; lim.connect(ac.destination);
    master = ac.createGain(); master.gain.value = 0.8; master.connect(lim);
    filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 18000; filt.Q.value = 6;
    dry = ac.createGain(); filt.connect(dry); dry.connect(master);
    echoSend = ac.createGain(); echoSend.gain.value = 0;
    echoDelay = ac.createDelay(1.0); echoDelay.delayTime.value = STEP_S * 3;
    echoFb = ac.createGain(); echoFb.gain.value = 0.42;
    filt.connect(echoSend); echoSend.connect(echoDelay); echoDelay.connect(echoFb); echoFb.connect(echoDelay); echoDelay.connect(master);
  }
  // ---- CHIPTUNE voices: pulse waves, triangle, stepped noise (like old console sound chips) ----
  var PULSE = {};
  function pulse(duty) {                         // band-limited pulse wave at a given duty cycle
    if (PULSE[duty]) return PULSE[duty];
    var n = 64, re = new Float32Array(n), im = new Float32Array(n);
    for (var k = 1; k < n; k++) im[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return (PULSE[duty] = ac.createPeriodicWave(re, im));
  }
  var NOISE = {};
  function chipNoise(hold) {                     // stepped noise: each random value held for `hold` samples
    if (NOISE[hold]) return NOISE[hold];
    var b = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate), d = b.getChannelData(0), v = 0;
    for (var i = 0; i < d.length; i++) { if (i % hold === 0) v = Math.random() < 0.5 ? -1 : 1; d[i] = v; }
    return (NOISE[hold] = b);
  }
  function tone(type, hz, t, dur, vol, out) {    // one chip oscillator with a stepped volume envelope
    var o = ac.createOscillator();
    if (type === 'tri') o.type = 'triangle'; else o.setPeriodicWave(pulse(type));
    o.frequency.setValueAtTime(hz, t);
    var e = ac.createGain(); e.gain.setValueAtTime(vol, t);
    e.gain.setValueAtTime(vol * 0.6, t + dur * 0.5); e.gain.setValueAtTime(0, t + dur);
    o.connect(e); e.connect(out); o.start(t); o.stop(t + dur + 0.01);
    return o;
  }
  function noise(hold, t, dur, vol, out) {
    var n = ac.createBufferSource(); n.buffer = chipNoise(hold);
    var e = ac.createGain(); e.gain.setValueAtTime(vol, t);
    e.gain.setValueAtTime(vol * 0.5, t + dur * 0.4); e.gain.setValueAtTime(0, t + dur);
    n.connect(e); e.connect(out); n.start(t); n.stop(t + dur + 0.01);
  }
  function play(v, t, hz) {
    var out = filt;
    if (v === 'k') {                               // KICK: triangle that drops in pitch
      var o = tone('tri', 180, t, 0.16, 0.95, out); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    } else if (v === 's') {                        // SNARE: square blip + coarse noise
      tone(0.5, 220, t, 0.04, 0.35, out); noise(6, t, 0.14, 0.4, out);
    } else if (v === 'h') {                        // HAT: very short fine noise tick
      noise(1, t, 0.035, 0.22, out);
    } else if (v === 'c') {                        // CLAP: three quick noise bursts
      [0, 0.018, 0.036].forEach(function (o2) { noise(3, t + o2, 0.05, 0.24, out); });
    } else if (v === 'b') {                        // BASS: triangle, the classic chip bassline
      var ob = tone('tri', hz * 1.12, t, 0.3, 0.9, out); ob.frequency.setValueAtTime(hz, t + 0.025);
    } else if (v === 'g') {                        // GUITAR: 12.5% pulse, fast root-5th-octave arpeggio
      var ratios = [1, 1.4983, 2, 1.4983, 1, 1.4983, 2];
      ratios.forEach(function (r, i) { tone(0.125, hz * r, t + i * 0.035, 0.035, 0.62, out); });
    } else if (v === 'v') {                        // VOICE: 25% pulse that slides up into the note, with vibrato
      var ov = ac.createOscillator(); ov.setPeriodicWave(pulse(0.25));
      ov.frequency.setValueAtTime(hz * 0.94, t); ov.frequency.linearRampToValueAtTime(hz, t + 0.04);
      var lfo = ac.createOscillator(), dep = ac.createGain(); lfo.frequency.value = 6.5; dep.gain.value = hz * 0.02;
      lfo.connect(dep); dep.connect(ov.frequency);
      var ev = ac.createGain(); ev.gain.setValueAtTime(0.62, t); ev.gain.setValueAtTime(0.5, t + 0.2); ev.gain.setValueAtTime(0, t + 0.36);
      ov.connect(ev); ev.connect(out); ov.start(t); lfo.start(t); ov.stop(t + 0.37); lfo.stop(t + 0.37);
    }
  }

  // ---- sequencer (look-ahead scheduling keeps the loop tight) ----
  function tick() {
    while (nextT < ac.currentTime + 0.12) {
      VOICES.forEach(function (v) { var x = pattern[v][step]; if (x) play(v, nextT, x); });
      if (state === 'record' && step % 4 === 0) click(nextT, step % 16 === 0);
      if (state === 'record' && step % NOW_EVERY === 0) scheduleNow(nextT);
      if (sweepOn) {
        var ph = (step % 16) / 16, f = 400 + 9000 * (0.5 + 0.5 * Math.sin(ph * Math.PI * 2));
        filt.frequency.setTargetAtTime(f, nextT, 0.05);
      }
      step = (step + 1) % STEPS; nextT += STEP_S;
    }
    paint();
  }
  function click(t, accent) {
    var o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = accent ? 1600 : 1100;
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.04);
  }
  // a tap lands on the nearest step of the loop
  function hit(v) {
    initAudio(); if (ac.state === 'suspended') ac.resume();
    var hz = true;
    if (MELODIC[v]) { hz = RIFF[v][riffAt[v] % RIFF[v].length]; riffAt[v]++; }
    play(v, ac.currentTime, hz);
    var pad = document.getElementById(v); pad.classList.add('hit'); setTimeout(function () { pad.classList.remove('hit'); }, 90);
    if (state !== 'record') return;
    var since = ac.currentTime - (nextT - STEP_S);       // time past the step just scheduled
    var s = (step - 1 + STEPS) % STEPS;
    if (since > STEP_S / 2) s = step;                      // closer to the next step
    pattern[v][s] = hz; paint();
  }

  // ---- NOW bubbles: pop up somewhere new on the beat; tap to play + record + score ----
  var layer = document.getElementById('nowLayer');
  function scheduleNow(beatT) {
    var delay = Math.max(0, (beatT - ac.currentTime) * 1000);
    setTimeout(function () { if (state === 'record') spawnNow(beatT); }, delay);
  }
  function spawnNow(beatT) {
    var v = VOICES[Math.floor(Math.random() * VOICES.length)];
    var W = window.innerWidth, H = window.innerHeight, pad = 60;
    var x = pad + Math.random() * (W - pad * 2), y = 90 + Math.random() * (H - 180);
    var el = document.createElement('div'); el.className = 'now';
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.background = COLORS[v]; el.style.color = COLORS[v];
    var b = document.createElement('b'); b.textContent = 'NOW'; b.style.color = '#16110c';
    var i = document.createElement('i'); i.textContent = NAMES[v]; i.style.color = '#16110c';
    el.appendChild(b); el.appendChild(i); layer.appendChild(el);
    var done = false;
    function tap(e) {
      if (e) e.preventDefault(); if (done) return; done = true;
      var off = Math.abs(ac.currentTime - beatT);
      var perfect = off < 0.12;
      combo++; score += perfect ? 3 : 1; if (perfect) perfects++;
      hit(v);
      feedback(x, y, perfect ? 'PERFECT' + (combo > 2 ? ' x' + combo : '') : 'GOOD');
      el.classList.add('gone'); setTimeout(function () { el.remove(); }, 220);
      showScore();
    }
    el.addEventListener('touchstart', tap, { passive: false });
    el.addEventListener('mousedown', tap);
    setTimeout(function () {
      if (!done) { done = true; combo = 0; el.classList.add('gone'); setTimeout(function () { el.remove(); }, 220); }
    }, NOW_LIFE * 1000);
  }
  function feedback(x, y, txt) {
    var f = document.createElement('div'); f.className = 'fb'; f.textContent = txt;
    f.style.left = x + 'px'; f.style.top = y + 'px'; layer.appendChild(f);
    setTimeout(function () { f.remove(); }, 720);
  }
  function showScore() { document.getElementById('score').textContent = 'SCORE ' + score + '   PERFECT ' + perfects; }

  function start() {
    initAudio(); if (ac.state === 'suspended') ac.resume();
    clearPattern(); riffAt = { b: 0, g: 0, v: 0 }; score = 0; perfects = 0; combo = 0; showScore();
    while (layer.firstChild) layer.removeChild(layer.firstChild);
    step = 0; nextT = ac.currentTime + 0.1; state = 'record'; t0 = Date.now();
    document.getElementById('win').classList.remove('show');
    document.getElementById('go').textContent = 'RECORDING...';
    document.getElementById('sub').textContent = '30 seconds - tap the NOW bubbles on the beat, or play the pads.';
    if (timer) clearInterval(timer); timer = setInterval(tick, 25);
    if (uiTimer) clearInterval(uiTimer);
    uiTimer = setInterval(function () {
      var p = Math.min(1, (Date.now() - t0) / ROUND_MS);
      document.getElementById('fill').style.width = (p * 100) + '%';
      if (p >= 1) { clearInterval(uiTimer); victory(); }
    }, 100);
  }
  function victory() {
    state = 'loop';
    var taps = 0; VOICES.forEach(function (v) { pattern[v].forEach(function (x) { if (x) taps++; }); });
    while (layer.firstChild) layer.removeChild(layer.firstChild);
    document.getElementById('winTxt').textContent = 'Score ' + score + ' · ' + perfects + ' perfect. Your beat is looping - tap START for a new one.';
    document.getElementById('win').classList.add('show');
    document.getElementById('go').textContent = 'START';
    document.getElementById('sub').textContent = taps ? ('Your beat: ' + taps + ' hits, looping.') : 'Silent beat! Tap START and try again.';
    setTimeout(function () { document.getElementById('win').classList.remove('show'); }, 3500);
  }

  // ---- input: pads respond on touchstart for low latency ----
  VOICES.forEach(function (v) {
    var el = document.getElementById(v);
    el.addEventListener('touchstart', function (e) { e.preventDefault(); hit(v); }, { passive: false });
    el.addEventListener('mousedown', function () { hit(v); });
  });
  document.getElementById('go').addEventListener('click', function () { if (state !== 'record') start(); });
  document.getElementById('fxEcho').addEventListener('click', function () {
    initAudio(); echoOn = !echoOn; this.classList.toggle('on', echoOn);
    echoSend.gain.setTargetAtTime(echoOn ? 0.45 : 0, ac.currentTime, 0.05);
  });
  document.getElementById('fxSweep').addEventListener('click', function () {
    initAudio(); sweepOn = !sweepOn; this.classList.toggle('on', sweepOn);
    if (!sweepOn) filt.frequency.setTargetAtTime(18000, ac.currentTime, 0.1);
  });
  // keyboard for desktop testing: A S D F
  document.addEventListener('keydown', function (e) { var m = { a: 'k', s: 's', d: 'h', f: 'c', j: 'b', k: 'g', l: 'v' }[e.key]; if (m) hit(m); });
  clearPattern();
})();
</script>
</body>
</html>
